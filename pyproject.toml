[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "segio-archive"
version = "0.6.4"
description = "SEGIO 결재 문서와 메일의 Windows 오프라인 보관 도구"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4==4.14.3", "playwright==1.62.0", "paramiko==4.0.0"]

[project.scripts]
segio-archive = "segio_archive.__main__:main"

[tool.setuptools.packages.find]
include = ["segio_archive*"]
